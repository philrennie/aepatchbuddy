<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patch Bay — AE Modular patch documentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://analytics.philrennie.co.uk/js/pa-0O063PS3grzPXWVL4fgfW.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
</head>
<body>

<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">PB</span>
      <span class="brand-name">Patch&nbsp;Bay</span>
    </div>

    <div class="patch-name-wrap">
      <label for="patch-name" class="patch-name-label">Patch</label>
      <input type="text" id="patch-name" placeholder="Untitled Patch" autocomplete="off" spellcheck="false">
    </div>

    <div class="topbar-actions">
      <button id="btn-zoom-out" class="icon-btn" title="Zoom out">–</button>
      <span id="zoom-label">100%</span>
      <button id="btn-zoom-in" class="icon-btn" title="Zoom in">+</button>
      <div class="divider"></div>
      <button id="btn-clear" class="text-btn">Clear rack</button>
      <button id="btn-import" class="text-btn">Import</button>
      <button id="btn-export" class="text-btn primary">Export patch</button>
      <input type="file" id="file-import" accept="application/json" hidden>
    </div>
  </header>

  <div id="body">

    <aside id="sidebar">
      <div class="sidebar-head">
        <input type="text" id="module-search" placeholder="Search modules…">
      </div>
      <div id="module-list"></div>
      <div class="sidebar-foot">
        Click or drag a module onto the rack.
      </div>
    </aside>

    <main id="rack-viewport">
      <div id="rack-canvas">
        <div id="instance-layer"></div>
        <svg id="cable-layer"></svg>
        <div id="jack-layer"></div>
      </div>
      <div id="empty-hint">
        <p>Your rack is empty.</p>
        <p>Add modules from the library on the left, then drag between jacks to patch them.</p>
      </div>
    </main>

  </div>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="js/panel-render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
