<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module Editor — Patch Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
<style>
:root {
  --bg: #161513;
  --panel: #232019;
  --panel-2: #1b1913;
  --border: #3a352c;
  --border-soft: #2a271f;
  --text: #f2ede4;
  --text-dim: #a8a196;
  --text-faint: #6f6a5f;
  --accent: #e8a33d;
  --accent-dim: #7a5a28;
  --danger: #d9695c;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

#app { height: 100vh; display: flex; flex-direction: column; }

/* --- topbar --- */
#topbar {
  height: 52px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}

.brand-mark {
  width: 26px; height: 26px;
  border: 1.5px solid var(--accent);
  border-radius: 4px;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  display: flex; align-items: center; justify-content: center;
  letter-spacing: 0.5px; flex: 0 0 auto;
}

.brand-name { font-size: 14px; font-weight: 600; }
.brand-sep { color: var(--text-faint); }
#topbar-subtitle { color: var(--text-dim); font-size: 13px; }

/* --- body --- */
#body { flex: 1 1 auto; display: flex; min-height: 0; }

/* --- side panels --- */
.side-panel {
  flex: 0 0 auto;
  background: var(--panel);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

#left-panel { width: 210px; border-right: 1px solid var(--border); }
#right-panel { width: 204px; border-left: 1px solid var(--border); }

.panel-section {
  padding: 12px;
  border-bottom: 1px solid var(--border-soft);
  flex: 0 0 auto;
}

.section-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

/* --- form fields --- */
.field { margin-bottom: 8px; }
.field:last-child { margin-bottom: 0; }

.field-label {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
  display: block;
}

.field input[type="text"],
.field input[type="number"] {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 5px 8px;
  transition: border-color 0.12s;
}

.field input:focus { outline: none; border-color: var(--accent-dim); }

.field-row { display: flex; gap: 6px; }
.field-row .field { flex: 1; margin-bottom: 0; }
.field-row-wrap { margin-bottom: 8px; }

/* --- tool buttons --- */
.tool-group { display: flex; flex-direction: column; gap: 4px; }

.tool-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: var(--sans);
  font-size: 12.5px;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s, color 0.12s;
  text-align: left;
  width: 100%;
}

.tool-btn:hover { border-color: var(--text-faint); color: var(--text); }

.tool-btn.active {
  border-color: var(--accent-dim);
  background: rgba(232,163,61,0.08);
  color: var(--accent);
}

.tool-icon { width: 16px; height: 16px; flex: 0 0 auto; }

.tool-shortcut {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-faint);
}

.tool-btn.active .tool-shortcut { color: var(--accent-dim); }

/* --- snap row --- */
.snap-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.snap-row input[type="checkbox"] {
  accent-color: var(--accent);
  width: 13px; height: 13px;
  cursor: pointer; flex: 0 0 auto;
}

.snap-row label { color: var(--text-dim); font-size: 12px; cursor: pointer; flex: 1; }

.snap-row input[type="number"] {
  width: 44px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 3px 6px;
  text-align: right;
}

.snap-row input[type="number"]:focus { outline: none; border-color: var(--accent-dim); }

.snap-unit { font-size: 11px; color: var(--text-faint); }

.ru-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.ru-row input[type="number"] {
  width: 48px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  padding: 5px 6px;
  text-align: right;
}

.ru-row input[type="number"]:focus { outline: none; border-color: var(--accent-dim); }

.ru-unit { font-size: 12px; color: var(--text-dim); font-family: var(--mono); }

.ru-hint { font-size: 11px; color: var(--text-faint); }

/* --- center canvas --- */
#center {
  flex: 1 1 auto;
  position: relative;
  overflow: auto;
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0) 0 0 / 24px 24px,
    var(--bg);
}

#canvas-wrap {
  padding: 48px;
  min-width: 100%;
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#editor-svg {
  display: block;
  flex: 0 0 auto;
  filter: drop-shadow(0 8px 28px rgba(0,0,0,0.65));
  user-select: none;
}

/* cursor modes */
#editor-svg.cursor-select { cursor: default; }
#editor-svg.cursor-add    { cursor: crosshair; }
#editor-svg.cursor-drag   { cursor: grabbing; }

/* --- right panel --- */
.prop-empty {
  color: var(--text-faint);
  font-size: 12px;
  line-height: 1.6;
}

.prop-type-badge {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 8px;
  margin-bottom: 2px;
}

.delete-btn {
  width: 100%;
  margin-top: 10px;
  padding: 7px;
  background: transparent;
  border: 1px solid var(--danger);
  border-radius: 4px;
  color: var(--danger);
  font-size: 12px;
  font-family: var(--sans);
  cursor: pointer;
  transition: background 0.12s;
}

.delete-btn:hover { background: rgba(217,105,92,0.1); }

/* --- label position picker --- */
.pos-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 3px;
  margin-top: 6px;
}

.pos-btn {
  padding: 5px 2px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: transparent;
  color: var(--text-dim);
  font-size: 10px;
  font-family: var(--mono);
  cursor: pointer;
  text-align: center;
  transition: border-color 0.1s, background 0.1s, color 0.1s;
  line-height: 1;
}

.pos-btn:hover { border-color: var(--text-faint); color: var(--text); }

.pos-btn.active {
  border-color: var(--accent-dim);
  color: var(--accent);
  background: rgba(232,163,61,0.08);
}

.pos-center {
  border: none !important;
  background: transparent !important;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-faint);
  font-size: 7px;
}

/* --- orientation toggle --- */
.orient-row {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}

.orient-btn {
  flex: 1;
  padding: 6px 4px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  font-family: var(--sans);
  cursor: pointer;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: border-color 0.12s, background 0.12s, color 0.12s;
}

.orient-btn:hover { border-color: var(--text-faint); color: var(--text); }

.orient-btn.active {
  border-color: var(--accent-dim);
  color: var(--accent);
  background: rgba(232,163,61,0.08);
}

/* --- waveform symbol picker --- */
.wave-pick-row {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}

.wave-pick-btn {
  flex: 1;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.12s, background 0.12s, color 0.12s;
}

.wave-pick-btn:hover { border-color: var(--text-faint); color: var(--text); }

.wave-pick-btn.active {
  border-color: var(--accent-dim);
  color: var(--accent);
  background: rgba(232,163,61,0.08);
}

.wave-pick-btn svg { display: block; }

/* --- bottom bar --- */
#bottom-bar {
  flex: 0 0 auto;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  justify-content: flex-end;
}

.action-btn {
  padding: 7px 14px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: var(--sans);
  font-size: 13px;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s, color 0.12s;
}

.action-btn:hover {
  border-color: var(--text-dim);
  color: var(--text);
  background: rgba(255,255,255,0.03);
}

.action-btn.primary {
  border-color: var(--accent-dim);
  color: var(--accent);
}

.action-btn.primary:hover {
  border-color: var(--accent);
  background: rgba(232,163,61,0.08);
}

.action-btn.danger { color: var(--danger); }
.action-btn.danger:hover { border-color: var(--danger); background: rgba(217,105,92,0.08); }

#copy-feedback {
  font-size: 11px;
  color: var(--accent);
  font-family: var(--mono);
  opacity: 0;
  transition: opacity 0.3s;
  margin-right: 4px;
}

#copy-feedback.visible { opacity: 1; }

/* --- toast --- */
#toast {
  position: fixed;
  bottom: 64px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 13px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  z-index: 100;
  max-width: 420px;
  text-align: center;
  line-height: 1.5;
  transition: opacity 0.3s;
}

#toast.error { border-color: var(--danger); color: #f0c4bd; }

/* scrollbar */
.side-panel::-webkit-scrollbar,
#center::-webkit-scrollbar { width: 8px; height: 8px; }
.side-panel::-webkit-scrollbar-thumb,
#center::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.side-panel::-webkit-scrollbar-track,
#center::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand-mark">PB</div>
    <span class="brand-name">Patch&nbsp;Bay</span>
    <span class="brand-sep">&mdash;</span>
    <span id="topbar-subtitle">Module Editor</span>
  </header>

  <div id="body">

    <!-- Left: settings + tools + grid -->
    <aside id="left-panel" class="side-panel">

      <div class="panel-section">
        <div class="section-label">Module</div>
        <div class="field">
          <label class="field-label" for="input-name">Name</label>
          <input type="text" id="input-name" value="New Module" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label class="field-label" for="input-id">ID <span style="color:var(--text-faint);font-size:10px;">(filename, no spaces)</span></label>
          <input type="text" id="input-id" value="new-module" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label class="field-label" for="input-width">Width</label>
          <div class="ru-row">
            <input type="number" id="input-width" value="1" min="1" max="8" step="1">
            <span class="ru-unit">RU</span>
            <span class="ru-hint">× 160 px</span>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="input-manufacturer">Manufacturer</label>
          <input type="text" id="input-manufacturer" placeholder="e.g. Tangible Waves" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label class="field-label" for="input-url">Product URL</label>
          <input type="text" id="input-url" placeholder="https://…" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label class="field-label" for="input-docs">Documentation URL</label>
          <input type="text" id="input-docs" placeholder="https://…" autocomplete="off" spellcheck="false">
        </div>
      </div>

      <div class="panel-section">
        <div class="section-label">Tool</div>
        <div class="tool-group">

          <button class="tool-btn active" data-mode="select">
            <svg class="tool-icon" viewBox="0 0 16 16" fill="none">
              <path d="M3 2 L13 8 L8 9.5 L6 14 Z" fill="currentColor"/>
            </svg>
            Select
            <span class="tool-shortcut">S / Esc</span>
          </button>

          <button class="tool-btn" data-mode="add-jack">
            <svg class="tool-icon" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="8" cy="8" r="2" fill="currentColor"/>
            </svg>
            Add Jack
            <span class="tool-shortcut">J</span>
          </button>

          <button class="tool-btn" data-mode="add-knob">
            <svg class="tool-icon" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/>
              <line x1="8" y1="8.5" x2="8" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Add Knob
            <span class="tool-shortcut">K</span>
          </button>

          <button class="tool-btn" data-mode="add-switch">
            <svg class="tool-icon" viewBox="0 0 16 16" fill="none">
              <rect x="5.5" y="1.5" width="5" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <rect x="6.5" y="2.5" width="3" height="4.5" rx="1" fill="currentColor"/>
            </svg>
            Add Switch
            <span class="tool-shortcut">W</span>
          </button>

        </div>
      </div>

      <div class="panel-section">
        <div class="section-label">Grid</div>
        <div class="snap-row">
          <input type="checkbox" id="snap-enable" checked>
          <label for="snap-enable">Snap</label>
          <input type="number" id="snap-size" value="10" min="1" max="80">
          <span class="snap-unit">px</span>
        </div>
      </div>

    </aside>

    <!-- Center: SVG canvas -->
    <main id="center">
      <div id="canvas-wrap">
        <svg id="editor-svg" xmlns="http://www.w3.org/2000/svg" class="cursor-add"></svg>
      </div>
    </main>

    <!-- Right: properties -->
    <aside id="right-panel" class="side-panel">
      <div class="panel-section" style="flex:1 1 auto;">
        <div class="section-label">Properties</div>
        <div id="props-content">
          <p class="prop-empty">Select a component to view and edit its properties.</p>
        </div>
      </div>
    </aside>

  </div>

  <footer id="bottom-bar">
    <button class="action-btn danger" id="btn-clear-module">Clear module</button>
    <span style="flex:1"></span>
    <span id="copy-feedback">Copied to clipboard</span>
    <button class="action-btn" id="btn-copy-json">Copy JSON entry</button>
    <button class="action-btn" id="btn-download-json">Download JSON</button>
    <button class="action-btn primary" id="btn-download-svg">Download SVG</button>
  </footer>

</div>
<div id="toast" hidden></div>
<script>
(function () {
  'use strict';

  // ---- module size constants ----
  const MODULE_HEIGHT  = 640;   // fixed panel height (100mm at AE Modular scale)
  const PIXELS_PER_RU  = 160;   // 1 rack unit = 25mm = 160px

  // Default template shown on first load and after "Clear module".
  // Positions are in native SVG pixel space (before MODULE_SCALE).
  const INIT_COMPONENTS = [
    { type: 'jack', x: 20,  y: 60,  label: '1', labelPosition: 'right' },
    { type: 'jack', x: 20,  y: 90,  label: '2', labelPosition: 'right' },
    { type: 'jack', x: 20,  y: 120, label: '3', labelPosition: 'right' },
    { type: 'jack', x: 20,  y: 150, label: '4', labelPosition: 'right' },
    { type: 'jack', x: 20,  y: 180, label: '5', labelPosition: 'right' },
    { type: 'jack', x: 20,  y: 210, label: '6', labelPosition: 'right' },
    { type: 'jack', x: 20,  y: 240, label: '7', labelPosition: 'right' },
    { type: 'jack', x: 20,  y: 270, label: '8', labelPosition: 'right' },
    { type: 'jack', x: 140, y: 60,  label: '1', labelPosition: 'left' },
    { type: 'jack', x: 140, y: 90,  label: '2', labelPosition: 'left' },
    { type: 'jack', x: 140, y: 120, label: '3', labelPosition: 'left' },
    { type: 'jack', x: 140, y: 150, label: '4', labelPosition: 'left' },
    { type: 'jack', x: 140, y: 180, label: '5', labelPosition: 'left' },
    { type: 'jack', x: 140, y: 210, label: '6', labelPosition: 'left' },
    { type: 'jack', x: 140, y: 240, label: '7', labelPosition: 'left' },
    { type: 'jack', x: 140, y: 270, label: '8', labelPosition: 'left' },
  ];

  // ---- state ----
  const state = {
    name: 'New Module',
    id: 'new-module',
    manufacturer: '',
    url: '',
    documentation: '',
    width: PIXELS_PER_RU,
    height: MODULE_HEIGHT,
    components: [],
    selectedId: null,
    mode: 'select',       // 'select' | 'add-jack' | 'add-knob' | 'add-switch'
    snapEnabled: true,
    snapSize: 10,
    _nextId: 1,
  };

  // ---- component geometry constants ----
  // Edit here; both the live preview and the exported SVG read from these.
  const LABEL_SIZE        = 11;   // font-size for all component labels
  const LABEL_GAP         = 8;   // px gap between component edge and label baseline
  const LABEL_BELOW_EXTRA = 10;   // extra clearance added only on the below side

  const JACK_R      = 9;         // jack outer radius
  const JACK_DOT_R  = 3;         // jack centre dot radius

  const KNOB_R        = 12;      // knob outer radius
  const KNOB_TICK_IN  = 6;       // tick line inner distance from centre
  const KNOB_TICK_OUT = 10;      // tick line outer distance from centre

  const SW_V_HW = 5;             // vertical switch half-width  (body x ± SW_V_HW)
  const SW_V_HH = 14;            // vertical switch half-height (body y ± SW_V_HH)
  const SW_H_HW = 14;            // horizontal switch half-width
  const SW_H_HH = 5;             // horizontal switch half-height

  // ---- waveform symbol labels ----
  // A label ("connection name" / knob or switch label) may be the literal
  // token `wave:<name>` — or `wave:a+b` for a composite — instead of text.
  // It renders as a vector glyph here and in the exported SVG, and shows as
  // a word ("Sawtooth") in the patch editor's hover tooltips.
  // Each path is drawn in a 14 × 14 local box (centre line ~y=7) and scaled
  // to LABEL_SIZE at render time.
  const WAVE_GLYPHS = {
    sine:     'M0,7 q3.5,-6 7,0 t7,0',
    square:   'M0,12 V4 H7 V12 H14 V4',
    triangle: 'M0,12 L7,4 L14,12',
    saw:      'M0,12 L14,4 V12',
  };
  const WAVE_ORDER = ['sine', 'square', 'triangle', 'saw'];
  const WAVE_WORDS = { sine: 'Sine', square: 'Square', triangle: 'Triangle', saw: 'Sawtooth' };

  // "wave:triangle+saw" -> ['triangle','saw'];  non-token / unknown name -> null
  function parseWave(s) {
    const m = /^wave:([a-z]+(?:\+[a-z]+)*)$/.exec(String(s || '').trim());
    if (!m) return null;
    const parts = m[1].split('+');
    return parts.every(p => WAVE_GLYPHS[p]) ? parts : null;
  }

  let ghost = null;     // {x, y} position while in add mode
  let drag = null;      // {id, sx, sy, ox, oy}

  // ---- DOM ----
  const svgEl      = document.getElementById('editor-svg');
  const inputName  = document.getElementById('input-name');
  const inputId    = document.getElementById('input-id');
  const inputW     = document.getElementById('input-width');
  const inputMfr   = document.getElementById('input-manufacturer');
  const inputUrl   = document.getElementById('input-url');
  const inputDocs  = document.getElementById('input-docs');
  const snapEnable = document.getElementById('snap-enable');
  const snapSizeEl = document.getElementById('snap-size');
  const propsDiv   = document.getElementById('props-content');
  const topbarSub  = document.getElementById('topbar-subtitle');
  const copyFb     = document.getElementById('copy-feedback');

  // ---- helpers ----
  const NS = 'http://www.w3.org/2000/svg';

  function uid() { return 'c' + (state._nextId++); }

  function applyInitState() {
    state.name          = 'Module';
    state.id            = 'module';
    state.manufacturer  = '';
    state.url           = '';
    state.documentation = '';
    state.width         = PIXELS_PER_RU;
    state.height        = MODULE_HEIGHT;
    state.selectedId    = null;
    state.mode          = 'select';
    state._nextId       = 1;
    state.components    = INIT_COMPONENTS.map(c => ({ ...c, id: uid() }));
  }

  function syncFormFromState() {
    inputName.value    = state.name;
    inputId.value      = state.id;
    inputMfr.value     = state.manufacturer || '';
    inputUrl.value     = state.url          || '';
    inputDocs.value    = state.documentation || '';
    inputW.value       = Math.max(1, Math.round(state.width / PIXELS_PER_RU));
    snapEnable.checked = state.snapEnabled;
    snapSizeEl.value   = state.snapSize;
  }

  function snap(v) {
    if (!state.snapEnabled) return Math.round(v);
    return Math.round(v / state.snapSize) * state.snapSize;
  }

  function svgPt(e) {
    const r = svgEl.getBoundingClientRect();
    return { x: snap(e.clientX - r.left), y: snap(e.clientY - r.top) };
  }

  function svgRaw(e) {
    const r = svgEl.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function byId(id) { return state.components.find(c => c.id === id); }

  function nameToId(name) {
    return (name || '')
      .toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '') || 'module';
  }

  function escXml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function mkEl(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v));
    return e;
  }

  // Returns {x, y, anchor} for a label placed in `pos` direction, `r` px from center (cx, cy).
  function labelPos(cx, cy, pos, r) {
    switch (pos) {
      case 'above': return { x: cx,               y: cy - r - LABEL_GAP,                    anchor: 'middle' };
      case 'left':  return { x: cx - r - LABEL_GAP, y: cy + Math.round(LABEL_SIZE * 0.35), anchor: 'end'    };
      case 'right': return { x: cx + r + LABEL_GAP, y: cy + Math.round(LABEL_SIZE * 0.35), anchor: 'start'  };
      default:      return { x: cx,               y: cy + r + LABEL_GAP + LABEL_BELOW_EXTRA, anchor: 'middle' }; // below
    }
  }

  function textEl(label, lp, fillColor) {
    const t = mkEl('text', {
      x: lp.x, y: lp.y,
      'text-anchor': lp.anchor,
      fill: fillColor,
      'font-family': 'IBM Plex Mono, monospace',
      'font-size': LABEL_SIZE,
    });
    t.textContent = label;
    return t;
  }

  // Geometry shared by the live-preview and exported wave glyph runs.
  // Returns { originX, box, s, gap } for `names` placed at label pos `lp`.
  function waveRun(names, lp) {
    const box = 14, s = LABEL_SIZE / box, gap = 3 * s;
    const runW = names.length * box * s + (names.length - 1) * gap;
    const originX = lp.anchor === 'end'    ? lp.x - runW
                  : lp.anchor === 'middle' ? lp.x - runW / 2
                  :                          lp.x;
    return { originX, box, s, gap };
  }

  // Live preview: one or more wave glyphs as a horizontal run at `lp`.
  function waveGlyphEl(names, lp, stroke) {
    const { originX, box, s, gap } = waveRun(names, lp);
    const g = mkEl('g');
    names.forEach((n, i) => {
      const seg = mkEl('g', {
        transform: `translate(${originX + i * (box * s + gap)},${lp.y - LABEL_SIZE}) scale(${s})`,
      });
      seg.appendChild(mkEl('path', {
        d: WAVE_GLYPHS[n], fill: 'none', stroke,
        'stroke-width': 1.5 / s, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      }));
      g.appendChild(seg);
    });
    return g;
  }

  // Live preview: a label that is a wave token renders as a glyph, else text.
  function labelG(label, lp, fillColor) {
    const w = parseWave(label);
    return w ? waveGlyphEl(w, lp, fillColor) : textEl(label, lp, fillColor);
  }

  // ---- SVG rendering ----

  // Each component type: returns an SVG <g> element.
  // isGhost = true → amber tint, reduced opacity, pointer-events:none

  function jackG(comp, isGhost) {
    const g = mkEl('g');
    if (!isGhost) { g.classList.add('comp'); g.dataset.id = comp.id; }
    const a = isGhost ? '0.5' : '1';
    const s = isGhost ? '#e8a33d' : '#8a8270';
    const fill = isGhost ? 'rgba(232,163,61,0.6)' : '#9a9282';

    g.appendChild(mkEl('circle', { cx: comp.x, cy: comp.y, r: JACK_R, fill: '#141210', stroke: s, 'stroke-width': 1.5, opacity: a }));
    g.appendChild(mkEl('circle', { cx: comp.x, cy: comp.y, r: JACK_DOT_R, fill: '#3a352c', opacity: a }));
    if (comp.label) {
      g.appendChild(labelG(comp.label, labelPos(comp.x, comp.y, comp.labelPosition || 'below', JACK_R), fill));
    }
    return g;
  }

  function knobG(comp, isGhost) {
    const g = mkEl('g');
    if (!isGhost) { g.classList.add('comp'); g.dataset.id = comp.id; }
    const a = isGhost ? '0.5' : '1';
    const s = isGhost ? '#e8a33d' : '#8a8270';
    const fill = isGhost ? 'rgba(232,163,61,0.6)' : '#9a9282';

    g.appendChild(mkEl('circle', { cx: comp.x, cy: comp.y, r: KNOB_R, fill: '#1e1c18', stroke: s, 'stroke-width': 1.5, opacity: a }));
    g.appendChild(mkEl('line', {
      x1: comp.x, y1: comp.y - KNOB_TICK_IN, x2: comp.x, y2: comp.y - KNOB_TICK_OUT,
      stroke: isGhost ? 'rgba(232,163,61,0.8)' : '#c8bfaa',
      'stroke-width': 1.5, 'stroke-linecap': 'round', opacity: a,
    }));
    if (comp.label) {
      g.appendChild(labelG(comp.label, labelPos(comp.x, comp.y, comp.labelPosition || 'below', KNOB_R), fill));
    }
    return g;
  }

  function switchG(comp, isGhost) {
    const g = mkEl('g');
    if (!isGhost) { g.classList.add('comp'); g.dataset.id = comp.id; }
    const a = isGhost ? '0.5' : '1';
    const s = isGhost ? '#e8a33d' : '#8a8270';
    const toggleFill = isGhost ? 'rgba(232,163,61,0.4)' : '#8a8270';
    const labelFill  = isGhost ? 'rgba(232,163,61,0.6)' : '#9a9282';
    const horiz = (comp.orientation || 'vertical') === 'horizontal';

    if (horiz) {
      const bw = SW_H_HW * 2, bh = SW_H_HH * 2;
      const tw = Math.round(bw * 0.39), th = bh - 2;
      g.appendChild(mkEl('rect', { x: comp.x - SW_H_HW, y: comp.y - SW_H_HH, width: bw, height: bh, rx: 3, fill: '#1e1c18', stroke: s, 'stroke-width': 1.5, opacity: a }));
      g.appendChild(mkEl('rect', { x: comp.x - SW_H_HW + 2, y: comp.y - SW_H_HH + 1, width: tw, height: th, rx: 2, fill: toggleFill, opacity: a }));
      const ly = comp.y + Math.round(LABEL_SIZE * 0.35);
      if (comp.label)  g.appendChild(labelG(comp.label,  { x: comp.x - SW_H_HW - LABEL_GAP, y: ly, anchor: 'end'   }, labelFill));
      if (comp.label2) g.appendChild(labelG(comp.label2, { x: comp.x + SW_H_HW + LABEL_GAP, y: ly, anchor: 'start' }, labelFill));
    } else {
      const bw = SW_V_HW * 2, bh = SW_V_HH * 2;
      const tw = bw - 2, th = Math.round(bh * 0.39);
      g.appendChild(mkEl('rect', { x: comp.x - SW_V_HW, y: comp.y - SW_V_HH, width: bw, height: bh, rx: 3, fill: '#1e1c18', stroke: s, 'stroke-width': 1.5, opacity: a }));
      g.appendChild(mkEl('rect', { x: comp.x - SW_V_HW + 1, y: comp.y - SW_V_HH + 2, width: tw, height: th, rx: 2, fill: toggleFill, opacity: a }));
      if (comp.label)  g.appendChild(labelG(comp.label,  { x: comp.x, y: comp.y - SW_V_HH - LABEL_GAP,                    anchor: 'middle' }, labelFill));
      if (comp.label2) g.appendChild(labelG(comp.label2, { x: comp.x, y: comp.y + SW_V_HH + LABEL_GAP + LABEL_BELOW_EXTRA, anchor: 'middle' }, labelFill));
    }
    return g;
  }

  function compG(comp, isGhost) {
    if (comp.type === 'jack')   return jackG(comp, isGhost);
    if (comp.type === 'knob')   return knobG(comp, isGhost);
    if (comp.type === 'switch') return switchG(comp, isGhost);
  }

  function selRadius(comp) {
    return comp.type === 'jack' ? 13 : 17;
  }

  function render() {
    const W = state.width, H = state.height;

    svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svgEl.setAttribute('width', W);
    svgEl.setAttribute('height', H);

    // clear
    while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);

    // panel background
    svgEl.appendChild(mkEl('rect', { x: 0, y: 0, width: W, height: H, fill: '#2b271f' }));
    svgEl.appendChild(mkEl('rect', { x: 4, y: 4, width: W - 8, height: H - 8, fill: 'none', stroke: '#4a4335', 'stroke-width': 2 }));
    for (const [cx, cy] of [[14, 14], [W - 14, 14], [14, H - 14], [W - 14, H - 14]]) {
      svgEl.appendChild(mkEl('circle', { cx, cy, r: 4, fill: '#141210' }));
    }
    const title = mkEl('text', {
      x: W / 2, y: 40,
      'text-anchor': 'middle',
      fill: '#e8a33d',
      'font-family': 'IBM Plex Mono, monospace',
      'font-size': 14,
      'letter-spacing': 1,
    });
    title.textContent = (state.name || 'UNTITLED').toUpperCase();
    svgEl.appendChild(title);

    // components
    for (const comp of state.components) {
      const g = compG(comp, false);
      svgEl.appendChild(g);
    }

    // selection ring
    if (state.selectedId) {
      const sel = byId(state.selectedId);
      if (sel) {
        const ring = mkEl('circle', {
          cx: sel.x, cy: sel.y,
          r: selRadius(sel),
          fill: 'none',
          stroke: '#e8a33d',
          'stroke-width': 1.5,
          'stroke-dasharray': '4 3',
          opacity: 0.85,
          'pointer-events': 'none',
        });
        svgEl.appendChild(ring);
      }
    }

    // ghost (add mode)
    if (ghost && state.mode !== 'select') {
      const type = state.mode.replace('add-', '');
      const ghostComp = { id: '__ghost__', type, x: ghost.x, y: ghost.y, label: '', label2: '', labelPosition: 'below', orientation: 'vertical' };
      const g = compG(ghostComp, true);
      g.setAttribute('pointer-events', 'none');
      svgEl.appendChild(g);
    }

    // cursor class (SVGElement.className is read-only SVGAnimatedString, must use setAttribute)
    svgEl.setAttribute('class', drag ? 'cursor-drag' : state.mode === 'select' ? 'cursor-select' : 'cursor-add');

    topbarSub.textContent = `Module Editor — ${state.name || 'Untitled'}`;
    saveToStorage();
  }

  // ---- properties panel ----
  function renderProps() {
    propsDiv.innerHTML = '';
    const comp = state.selectedId ? byId(state.selectedId) : null;

    if (!comp) {
      propsDiv.innerHTML = '<p class="prop-empty">Select a component to view and edit its properties.</p>';
      return;
    }

    function append(el) { propsDiv.appendChild(el); }

    // ---- jack / knob: label + position picker ----
    if (comp.type === 'jack' || comp.type === 'knob') {
      append(labelEditor(
        comp.type === 'jack' ? 'Connection name' : 'Label',
        () => comp.label || '',
        v => { comp.label = v; },
        'e.g. CV IN'
      ));

      // label position label
      const posLabel = document.createElement('div');
      posLabel.className = 'field-label';
      posLabel.style.marginTop = '8px';
      posLabel.textContent = 'Label position';
      append(posLabel);

      // 3×3 grid: top-row [_, above, _], mid-row [left, ▣, right], bot-row [_, below, _]
      const grid = document.createElement('div');
      grid.className = 'pos-grid';

      const positions = [
        null,    'above', null,
        'left',  null,    'right',
        null,    'below', null,
      ];

      const cur = comp.labelPosition || 'below';

      for (const pos of positions) {
        if (pos === null) {
          const cell = document.createElement('div');
          cell.className = 'pos-center';
          cell.textContent = pos === null && positions.indexOf(pos) === 4 ? '▣' : '';
          grid.appendChild(cell);
        } else {
          const btn = document.createElement('button');
          btn.className = 'pos-btn' + (pos === cur ? ' active' : '');
          btn.textContent = pos;
          btn.addEventListener('click', () => {
            comp.labelPosition = pos;
            render();
            renderProps();
          });
          grid.appendChild(btn);
        }
      }
      // fix center cell text
      grid.children[4].textContent = '▣';

      append(grid);
    }

    // ---- switch: two position labels + orientation ----
    if (comp.type === 'switch') {
      const horiz = (comp.orientation || 'vertical') === 'horizontal';

      // orientation first
      const orLabel = document.createElement('div');
      orLabel.className = 'field-label';
      orLabel.textContent = 'Orientation';
      append(orLabel);

      const orientRow = document.createElement('div');
      orientRow.className = 'orient-row';

      for (const [val, icon, txt] of [['vertical', '⬍', 'Vertical'], ['horizontal', '⬌', 'Horizontal']]) {
        const btn = document.createElement('button');
        btn.className = 'orient-btn' + ((comp.orientation || 'vertical') === val ? ' active' : '');
        btn.innerHTML = `${icon} ${txt}`;
        btn.addEventListener('click', () => {
          comp.orientation = val;
          render();
          renderProps();
        });
        orientRow.appendChild(btn);
      }
      append(orientRow);

      // label fields: position 1 and 2
      const pos1Name = horiz ? 'Label left (pos 1)' : 'Label above (pos 1)';
      const pos2Name = horiz ? 'Label right (pos 2)' : 'Label below (pos 2)';

      append(labelEditor(pos1Name, () => comp.label  || '', v => { comp.label  = v; }, 'e.g. ON',  '10px'));
      append(labelEditor(pos2Name, () => comp.label2 || '', v => { comp.label2 = v; }, 'e.g. OFF'));
    }

    // ---- x / y (all types) ----
    const xyWrap = document.createElement('div');
    xyWrap.style.marginTop = '10px';
    const xyRow = document.createElement('div');
    xyRow.className = 'field-row';

    for (const axis of ['x', 'y']) {
      const f = field(axis.toUpperCase(), 'number', comp[axis], '', { step: state.snapSize, min: 0 });
      const inp = f.querySelector('input');
      inp.dataset.axis = axis;
      inp.addEventListener('input', () => {
        const v = parseFloat(inp.value);
        if (!isNaN(v)) { comp[axis] = v; render(); }
      });
      xyRow.appendChild(f);
    }

    xyWrap.appendChild(xyRow);
    append(xyWrap);

    // type badge
    const badge = document.createElement('div');
    badge.className = 'prop-type-badge';
    badge.textContent = comp.type;
    append(badge);

    // delete
    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.textContent = 'Delete component';
    del.addEventListener('click', () => {
      state.components = state.components.filter(c => c.id !== comp.id);
      state.selectedId = null;
      render();
      renderProps();
    });
    append(del);
  }

  function field(labelText, type, value, placeholder, extra = {}) {
    const d = document.createElement('div');
    d.className = 'field';
    const l = document.createElement('label');
    l.className = 'field-label';
    l.textContent = labelText;
    const inp = document.createElement('input');
    inp.type = type;
    inp.value = value;
    if (placeholder) inp.placeholder = placeholder;
    for (const [k, v] of Object.entries(extra)) inp[k] = v;
    d.appendChild(l);
    d.appendChild(inp);
    return d;
  }

  // A label input that can be either free text or a waveform symbol.
  // getVal/setVal read & write the underlying string (comp.label / comp.label2).
  // Switching kind or picking a glyph mutates state then re-renders the panel.
  function labelEditor(titleText, getVal, setVal, placeholder, marginTop) {
    const wrap = document.createElement('div');
    wrap.className = 'field-row-wrap';
    if (marginTop) wrap.style.marginTop = marginTop;

    const heading = document.createElement('label');
    heading.className = 'field-label';
    heading.textContent = titleText;
    wrap.appendChild(heading);

    const cur = getVal() || '';
    const waveParts = parseWave(cur);        // array | null
    const isWave = !!waveParts;

    // kind toggle: Abc / ∿
    const toggle = document.createElement('div');
    toggle.className = 'orient-row';
    for (const [kind, txt] of [['text', 'Abc'], ['wave', '∿']]) {
      const b = document.createElement('button');
      b.className = 'orient-btn' + ((kind === 'wave') === isWave ? ' active' : '');
      b.textContent = txt;
      b.title = kind === 'wave' ? 'Waveform symbol' : 'Text';
      b.addEventListener('click', () => {
        if (kind === 'wave' && !isWave) setVal('wave:sine');
        else if (kind === 'text' && isWave) setVal('');
        else return;
        render();
        renderProps();
      });
      toggle.appendChild(b);
    }
    wrap.appendChild(toggle);

    if (isWave) {
      const row = document.createElement('div');
      row.className = 'wave-pick-row';
      for (const name of WAVE_ORDER) {
        const b = document.createElement('button');
        b.className = 'wave-pick-btn' + (waveParts.includes(name) ? ' active' : '');
        b.title = WAVE_WORDS[name];
        b.innerHTML =
          `<svg viewBox="-1 -1 16 16" width="20" height="20" aria-hidden="true">` +
          `<path d="${WAVE_GLYPHS[name]}" fill="none" stroke="currentColor" stroke-width="1.5" ` +
          `stroke-linejoin="round" stroke-linecap="round"/></svg>`;
        b.addEventListener('click', () => {
          let parts = waveParts.slice();
          if (parts.includes(name)) {
            parts = parts.filter(p => p !== name);
            if (!parts.length) parts = [name];      // keep at least one glyph
          } else {
            parts.push(name);
          }
          parts.sort((a, z) => WAVE_ORDER.indexOf(a) - WAVE_ORDER.indexOf(z));
          setVal('wave:' + parts.join('+'));
          render();
          renderProps();
        });
        row.appendChild(b);
      }
      wrap.appendChild(row);

      const hint = document.createElement('div');
      hint.className = 'ru-hint';
      hint.style.marginTop = '4px';
      hint.textContent = 'Tap more than one for a combined symbol.';
      wrap.appendChild(hint);
    } else {
      const f = field('', 'text', cur, placeholder);
      f.style.marginTop = '6px';
      f.querySelector('label').remove();
      f.querySelector('input').addEventListener('input', e => { setVal(e.target.value); render(); });
      wrap.appendChild(f);
    }

    return wrap;
  }

  // ---- SVG events ----
  svgEl.addEventListener('mousemove', e => {
    if (state.mode !== 'select') {
      ghost = svgPt(e);
      render();
    }

    if (drag) {
      e.preventDefault();
      const raw = svgRaw(e);
      const comp = byId(drag.id);
      if (comp) {
        comp.x = snap(drag.ox + (raw.x - drag.sx));
        comp.y = snap(drag.oy + (raw.y - drag.sy));
        render();
        // update x/y inputs in props without full re-render
        const inputs = propsDiv.querySelectorAll('input[data-axis]');
        for (const inp of inputs) inp.value = comp[inp.dataset.axis];
      }
    }
  });

  svgEl.addEventListener('mouseleave', () => {
    if (state.mode !== 'select' && !drag) {
      ghost = null;
      render();
    }
  });

  svgEl.addEventListener('mousedown', e => {
    if (e.button !== 0) return;

    if (state.mode !== 'select') {
      // Place component
      e.preventDefault();
      const pt = svgPt(e);
      const type = state.mode.replace('add-', '');
      const defaults = type === 'switch'
        ? { label: '', label2: '', orientation: 'vertical' }
        : { label: '', labelPosition: 'below' };
      const comp = { id: uid(), type, x: pt.x, y: pt.y, ...defaults };
      state.components.push(comp);
      state.selectedId = comp.id;
      setMode('select');
      render();
      renderProps();
      return;
    }

    // hit-test in select mode
    const hit = e.target.closest('.comp');
    if (hit) {
      e.preventDefault();
      const id = hit.dataset.id;
      state.selectedId = id;
      const comp = byId(id);
      const raw = svgRaw(e);
      drag = { id, sx: raw.x, sy: raw.y, ox: comp.x, oy: comp.y };
      render();
      renderProps();
    } else {
      if (state.selectedId) {
        state.selectedId = null;
        render();
        renderProps();
      }
    }
  });

  svgEl.addEventListener('mouseup', () => { drag = null; render(); });
  document.addEventListener('mouseup', () => { if (drag) { drag = null; render(); } });

  // ---- keyboard ----
  document.addEventListener('keydown', e => {
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;

    if ((e.key === 'Delete' || e.key === 'Backspace') && state.selectedId) {
      state.components = state.components.filter(c => c.id !== state.selectedId);
      state.selectedId = null;
      render();
      renderProps();
    }
    if (e.key === 'Escape' || e.key === 's') setMode('select');
    if (e.key === 'j') setMode('add-jack');
    if (e.key === 'k') setMode('add-knob');
    if (e.key === 'w') setMode('add-switch');
  });

  // ---- tool buttons ----
  document.querySelectorAll('.tool-btn').forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  function setMode(mode) {
    state.mode = mode;
    ghost = null;
    document.querySelectorAll('.tool-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    render();
  }

  // ---- module settings ----
  let idManual = false;

  inputName.addEventListener('input', () => {
    state.name = inputName.value;
    if (!idManual) {
      state.id = nameToId(state.name);
      inputId.value = state.id;
    }
    render();
  });

  inputId.addEventListener('input', () => {
    idManual = true;
    state.id = inputId.value;
  });

  inputId.addEventListener('blur', () => {
    state.id = nameToId(state.id) || nameToId(state.name) || 'module';
    inputId.value = state.id;
  });

  inputMfr.addEventListener('input',  () => { state.manufacturer  = inputMfr.value;  });
  inputUrl.addEventListener('input',  () => { state.url           = inputUrl.value;  });
  inputDocs.addEventListener('input', () => { state.documentation = inputDocs.value; });

  inputW.addEventListener('input', () => {
    const ru = Math.max(1, Math.min(8, parseInt(inputW.value, 10) || 1));
    state.width = ru * PIXELS_PER_RU;
    render();
  });

  snapEnable.addEventListener('change', () => { state.snapEnabled = snapEnable.checked; });

  snapSizeEl.addEventListener('input', () => {
    const v = parseInt(snapSizeEl.value, 10);
    if (v >= 1) state.snapSize = v;
  });

  // ---- export ----
  function buildSVGString() {
    const W = state.width, H = state.height;
    const lines = [];
    lines.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`);
    lines.push(`  <rect x="0" y="0" width="${W}" height="${H}" fill="#2b271f"/>`);
    lines.push(`  <rect x="4" y="4" width="${W - 8}" height="${H - 8}" fill="none" stroke="#4a4335" stroke-width="2"/>`);
    lines.push(`  <circle cx="14" cy="14" r="4" fill="#141210"/>`);
    lines.push(`  <circle cx="${W - 14}" cy="14" r="4" fill="#141210"/>`);
    lines.push(`  <circle cx="14" cy="${H - 14}" r="4" fill="#141210"/>`);
    lines.push(`  <circle cx="${W - 14}" cy="${H - 14}" r="4" fill="#141210"/>`);
    lines.push(`  <text x="${W / 2}" y="40" text-anchor="middle" fill="#e8a33d" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="1">${escXml((state.name || 'UNTITLED').toUpperCase())}</text>`);

    function svgText(label, lp) {
      return `  <text x="${lp.x}" y="${lp.y}" text-anchor="${lp.anchor}" fill="#9a9282" font-family="IBM Plex Mono, monospace" font-size="${LABEL_SIZE}">${escXml(label)}</text>`;
    }

    function svgWave(names, lp) {
      const { originX, box, s, gap } = waveRun(names, lp);
      return names.map((n, i) =>
        `  <g transform="translate(${originX + i * (box * s + gap)},${lp.y - LABEL_SIZE}) scale(${s})">` +
        `<path d="${WAVE_GLYPHS[n]}" fill="none" stroke="#9a9282" stroke-width="${1.5 / s}" ` +
        `stroke-linejoin="round" stroke-linecap="round"/></g>`
      ).join('\n');
    }

    // A wave token renders as a glyph run; anything else as <text>.
    function svgLabel(label, lp) {
      const w = parseWave(label);
      return w ? svgWave(w, lp) : svgText(label, lp);
    }

    for (const c of state.components) {
      if (c.type === 'jack') {
        lines.push(`  <circle cx="${c.x}" cy="${c.y}" r="${JACK_R}" fill="#141210" stroke="#8a8270" stroke-width="1.5"/>`);
        if (c.label) lines.push(svgLabel(c.label, labelPos(c.x, c.y, c.labelPosition || 'below', JACK_R)));
      } else if (c.type === 'knob') {
        lines.push(`  <circle cx="${c.x}" cy="${c.y}" r="${KNOB_R}" fill="#1e1c18" stroke="#8a8270" stroke-width="1.5"/>`);
        lines.push(`  <line x1="${c.x}" y1="${c.y - KNOB_TICK_IN}" x2="${c.x}" y2="${c.y - KNOB_TICK_OUT}" stroke="#c8bfaa" stroke-width="1.5" stroke-linecap="round"/>`);
        if (c.label) lines.push(svgLabel(c.label, labelPos(c.x, c.y, c.labelPosition || 'below', KNOB_R)));
      } else if (c.type === 'switch') {
        const horiz = (c.orientation || 'vertical') === 'horizontal';
        if (horiz) {
          const bw = SW_H_HW * 2, bh = SW_H_HH * 2;
          const tw = Math.round(bw * 0.39), th = bh - 2;
          lines.push(`  <rect x="${c.x - SW_H_HW}" y="${c.y - SW_H_HH}" width="${bw}" height="${bh}" rx="3" fill="#1e1c18" stroke="#8a8270" stroke-width="1.5"/>`);
          lines.push(`  <rect x="${c.x - SW_H_HW + 2}" y="${c.y - SW_H_HH + 1}" width="${tw}" height="${th}" rx="2" fill="#8a8270"/>`);
          const ly = c.y + Math.round(LABEL_SIZE * 0.35);
          if (c.label)  lines.push(svgLabel(c.label,  { x: c.x - SW_H_HW - LABEL_GAP, y: ly, anchor: 'end'   }));
          if (c.label2) lines.push(svgLabel(c.label2, { x: c.x + SW_H_HW + LABEL_GAP, y: ly, anchor: 'start' }));
        } else {
          const bw = SW_V_HW * 2, bh = SW_V_HH * 2;
          const tw = bw - 2, th = Math.round(bh * 0.39);
          lines.push(`  <rect x="${c.x - SW_V_HW}" y="${c.y - SW_V_HH}" width="${bw}" height="${bh}" rx="3" fill="#1e1c18" stroke="#8a8270" stroke-width="1.5"/>`);
          lines.push(`  <rect x="${c.x - SW_V_HW + 1}" y="${c.y - SW_V_HH + 2}" width="${tw}" height="${th}" rx="2" fill="#8a8270"/>`);
          if (c.label)  lines.push(svgLabel(c.label,  { x: c.x, y: c.y - SW_V_HH - LABEL_GAP,                    anchor: 'middle' }));
          if (c.label2) lines.push(svgLabel(c.label2, { x: c.x, y: c.y + SW_V_HH + LABEL_GAP + LABEL_BELOW_EXTRA, anchor: 'middle' }));
        }
      }
    }

    lines.push(`</svg>`);
    return lines.join('\n');
  }

  function buildJSON() {
    const id = state.id || nameToId(state.name) || 'module';
    const connections = state.components
      .filter(c => c.type === 'jack')
      .map(c => ({ id: c.id, name: c.label || c.id, position: { x: c.x, y: c.y } }));
    const controls = state.components
      .filter(c => c.type === 'knob' || c.type === 'switch')
      .map(c => {
        const entry = { id: c.id, type: c.type, label: c.label || '', position: { x: c.x, y: c.y } };
        if (c.type === 'switch') {
          entry.label2 = c.label2 || '';
          entry.orientation = c.orientation || 'vertical';
        }
        return entry;
      });

    return JSON.stringify({
      id,
      name: state.name || 'Untitled',
      ...(state.manufacturer ? { manufacturer: state.manufacturer } : {}),
      ...(state.url          ? { url:          state.url          } : {}),
      ...(state.documentation ? { documentation: state.documentation } : {}),
      width: state.width,
      height: state.height,
      connections,
      ...(controls.length ? { controls } : {}),
    }, null, 2);
  }

  document.getElementById('btn-download-svg').addEventListener('click', () => {
    const blob = new Blob([buildSVGString()], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${state.id || 'module'}.svg`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('btn-copy-json').addEventListener('click', () => {
    navigator.clipboard.writeText(buildJSON()).then(() => {
      copyFb.classList.add('visible');
      setTimeout(() => copyFb.classList.remove('visible'), 1800);
    });
  });

  document.getElementById('btn-download-json').addEventListener('click', () => {
    const blob = new Blob([buildJSON()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${state.id || 'module'}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  // ---- localStorage persistence ----
  const STORAGE_KEY     = 'patchbay-module-editor';
  const STORAGE_VERSION = 1;
  // Increment STORAGE_VERSION whenever a saved-data schema change would prevent
  // older saves from loading correctly. The load path will detect the mismatch,
  // discard the stale data, and show the user an apology toast.

  let _toastTimer = null;
  function showToast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = isError ? 'error' : '';
    el.hidden = false;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { el.hidden = true; }, isError ? 6000 : 3000);
  }

  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: STORAGE_VERSION,
        name: state.name,
        id: state.id,
        manufacturer: state.manufacturer,
        url: state.url,
        documentation: state.documentation,
        width: state.width,
        height: state.height,
        components: state.components,
        snapEnabled: state.snapEnabled,
        snapSize: state.snapSize,
        _nextId: state._nextId,
      }));
    } catch (_) {}
  }

  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const s = JSON.parse(raw);
      if (!s || typeof s !== 'object') return false;

      if (s.version !== STORAGE_VERSION) {
        localStorage.removeItem(STORAGE_KEY);
        showToast(
          'Your saved module could not be loaded — the editor has been updated since your last visit and the format changed. Sorry for the inconvenience.',
          true
        );
        return false;
      }

      if (s.name          !== undefined) state.name          = s.name;
      if (s.id            !== undefined) state.id            = s.id;
      if (s.manufacturer  !== undefined) state.manufacturer  = s.manufacturer;
      if (s.url           !== undefined) state.url           = s.url;
      if (s.documentation !== undefined) state.documentation = s.documentation;
      if (s.width         !== undefined) state.width         = Math.max(PIXELS_PER_RU, Math.round(s.width / PIXELS_PER_RU) * PIXELS_PER_RU);
      state.height = MODULE_HEIGHT;
      if (Array.isArray(s.components)) state.components  = s.components;
      if (s.snapEnabled !== undefined) state.snapEnabled  = s.snapEnabled;
      if (s.snapSize    !== undefined) state.snapSize     = Math.max(1,   s.snapSize);
      if (s._nextId     !== undefined) state._nextId      = s._nextId;
      return true;
    } catch (_) { return false; }
  }

  document.getElementById('btn-clear-module').addEventListener('click', () => {
    if (!confirm('Clear the module? All components will be removed and the template restored.')) return;
    applyInitState();
    localStorage.removeItem(STORAGE_KEY);
    syncFormFromState();
    render();
    renderProps();
  });

  // ---- init ----
  applyInitState();
  loadFromStorage();   // overwrites state if saved data exists
  syncFormFromState();
  render();
  renderProps();

}());
</script>
</body>
</html>
