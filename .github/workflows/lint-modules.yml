name: Lint Modules

on:
  pull_request:
    paths:
      - 'src/modules/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate module definitions
        run: node scripts/lint-modules.js
